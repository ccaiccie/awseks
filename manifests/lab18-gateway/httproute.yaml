# OPT-IN. Requires Gateway API standard CRDs v1.6.0 and the AWS Load Balancer
# Controller Gateway CRDs that match controller 3.6.2. See lab 18. kubeconform
# does not ship these CRDs; do not treat a missing schema as proof the API exists.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-gateway
  labels:
    app.kubernetes.io/part-of: awseks-practice
    awseks.practice/owner: student
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: lab-gateway
spec:
  gatewayClassName: aws-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: lab-gateway
spec:
  parentRefs:
    - name: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
