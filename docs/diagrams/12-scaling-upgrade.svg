<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img">
<title>Scaling and upgrades</title>
<rect width='100%' height='100%' fill='#ffffff'/>
<style>text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1d2430} .title{font-size:18px;font-weight:700}</style>
<text class='title' x='24' y='28'>Scaling and upgrades</text>
<rect x='40' y='76' width='220' height='70' rx='10' fill='#E7F7F7' stroke='#31415a' stroke-width='1.4'/>
<text x='150.0' y='102.0' text-anchor='middle'>HPA</text>
<text x='150.0' y='120.0' text-anchor='middle'>metrics-server</text>
<rect x='300' y='76' width='220' height='70' rx='10' fill='#E7F7F7' stroke='#31415a' stroke-width='1.4'/>
<text x='410.0' y='111.0' text-anchor='middle'>Deployment replicas</text>
<rect x='560' y='76' width='280' height='70' rx='10' fill='#FFF4E0' stroke='#31415a' stroke-width='1.4'/>
<text x='700.0' y='102.0' text-anchor='middle'>Managed node group</text>
<text x='700.0' y='120.0' text-anchor='middle'>desired size</text>
<rect x='40' y='196' width='250' height='80' rx='10' fill='#F7F7F5' stroke='#31415a' stroke-width='1.4'/>
<text x='165.0' y='218.0' text-anchor='middle'>Cluster Autoscaler</text>
<text x='165.0' y='236.0' text-anchor='middle'>optional, fights Terraform</text>
<text x='165.0' y='254.0' text-anchor='middle'>if desired size is not ignored</text>
<rect x='330' y='196' width='250' height='80' rx='10' fill='#F7F7F5' stroke='#31415a' stroke-width='1.4'/>
<text x='455.0' y='218.0' text-anchor='middle'>Karpenter</text>
<text x='455.0' y='236.0' text-anchor='middle'>optional, Kubernetes 1.35</text>
<text x='455.0' y='254.0' text-anchor='middle'>needs Karpenter &gt;= 1.9</text>
<rect x='620' y='196' width='220' height='80' rx='10' fill='#FDECEC' stroke='#31415a' stroke-width='1.4'/>
<text x='730.0' y='227.0' text-anchor='middle'>PDB and drain</text>
<text x='730.0' y='245.0' text-anchor='middle'>before surge or spot</text>
<rect x='40' y='316' width='800' height='50' rx='10' fill='#F7F7F5' stroke='#31415a' stroke-width='1.4'/>
<text x='440.0' y='341.0' text-anchor='middle'>Do not run Cluster Autoscaler and Karpenter against the same capacity.</text>
</svg>
