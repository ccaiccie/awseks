<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
<title>Security groups and NetworkPolicy</title>
<rect width='100%' height='100%' fill='#ffffff'/>
<style>text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1d2430} .title{font-size:18px;font-weight:700}</style>
<text class='title' x='24' y='28'>Security groups and NetworkPolicy</text>
<rect x='40' y='76' width='200' height='80' rx='10' fill='#F7F7F5' stroke='#31415a' stroke-width='1.4'/>
<text x='140.0' y='116.0' text-anchor='middle'>Packet</text>
<rect x='280' y='66' width='240' height='90' rx='10' fill='#F3E8FF' stroke='#31415a' stroke-width='1.4'/>
<text x='400.0' y='102.0' text-anchor='middle'>Security group</text>
<text x='400.0' y='120.0' text-anchor='middle'>stateful, on the ENI</text>
<rect x='560' y='66' width='240' height='90' rx='10' fill='#FFF4E0' stroke='#31415a' stroke-width='1.4'/>
<text x='680.0' y='93.0' text-anchor='middle'>Network ACL</text>
<text x='680.0' y='111.0' text-anchor='middle'>stateless, on the subnet</text>
<text x='680.0' y='129.0' text-anchor='middle'>lab leaves the default</text>
<rect x='280' y='206' width='240' height='90' rx='10' fill='#E7F7F7' stroke='#31415a' stroke-width='1.4'/>
<text x='400.0' y='233.0' text-anchor='middle'>NetworkPolicy</text>
<text x='400.0' y='251.0' text-anchor='middle'>VPC CNI enforcement</text>
<text x='400.0' y='269.0' text-anchor='middle'>namespace lab only</text>
<rect x='560' y='206' width='240' height='90' rx='10' fill='#FDECEC' stroke='#31415a' stroke-width='1.4'/>
<text x='680.0' y='242.0' text-anchor='middle'>Denied here</text>
<text x='680.0' y='260.0' text-anchor='middle'>does not change the route table</text>
<rect x='40' y='336' width='760' height='60' rx='10' fill='#F7F7F5' stroke='#31415a' stroke-width='1.4'/>
<text x='420.0' y='366.0' text-anchor='middle'>A VPC route decides where a packet can go. A NetworkPolicy decides which pods may talk. IAM does neither.</text>
</svg>
