<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img">
<title>Human IAM, access entries, and RBAC</title>
<rect width='100%' height='100%' fill='#ffffff'/>
<style>text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1d2430} .title{font-size:18px;font-weight:700}</style>
<text class='title' x='24' y='28'>Human IAM, access entries, and RBAC</text>
<rect x='40' y='76' width='250' height='80' rx='10' fill='#EEF2FF' stroke='#31415a' stroke-width='1.4'/>
<text x='165.0' y='107.0' text-anchor='middle'>Human IAM principal</text>
<text x='165.0' y='125.0' text-anchor='middle'>creator or named role</text>
<rect x='340' y='76' width='250' height='80' rx='10' fill='#F3E8FF' stroke='#31415a' stroke-width='1.4'/>
<text x='465.0' y='107.0' text-anchor='middle'>Access entry</text>
<text x='465.0' y='125.0' text-anchor='middle'>type STANDARD</text>
<rect x='640' y='76' width='280' height='80' rx='10' fill='#E7F7F7' stroke='#31415a' stroke-width='1.4'/>
<text x='780.0' y='107.0' text-anchor='middle'>AmazonEKSClusterAdminPolicy</text>
<text x='780.0' y='125.0' text-anchor='middle'>or View, or your own RBAC</text>
<rect x='40' y='216' width='250' height='90' rx='10' fill='#FFF4E0' stroke='#31415a' stroke-width='1.4'/>
<text x='165.0' y='243.0' text-anchor='middle'>Node IAM role</text>
<text x='165.0' y='261.0' text-anchor='middle'>type EC2_LINUX</text>
<text x='165.0' y='279.0' text-anchor='middle'>not cluster-admin</text>
<rect x='340' y='216' width='250' height='90' rx='10' fill='#EEF2FF' stroke='#31415a' stroke-width='1.4'/>
<text x='465.0' y='243.0' text-anchor='middle'>Workload role</text>
<text x='465.0' y='261.0' text-anchor='middle'>Pod Identity or IRSA</text>
<text x='465.0' y='279.0' text-anchor='middle'>not a human entry</text>
<rect x='640' y='216' width='280' height='90' rx='10' fill='#E7F7F7' stroke='#31415a' stroke-width='1.4'/>
<text x='780.0' y='243.0' text-anchor='middle'>Kubernetes RBAC</text>
<text x='780.0' y='261.0' text-anchor='middle'>Role and RoleBinding</text>
<text x='780.0' y='279.0' text-anchor='middle'>still apply inside the cluster</text>
<rect x='40' y='346' width='880' height='60' rx='10' fill='#F7F7F5' stroke='#31415a' stroke-width='1.4'/>
<text x='480.0' y='376.0' text-anchor='middle'>Authentication mode API does not use the aws-auth ConfigMap. IAM is not the same check as a Kubernetes verb.</text>
</svg>
