<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" role="img">
<title>NAT, ECR, and S3</title>
<rect width='100%' height='100%' fill='#ffffff'/>
<style>text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1d2430} .title{font-size:18px;font-weight:700}</style>
<text class='title' x='24' y='28'>NAT, ECR, and S3</text>
<rect x='40' y='116' width='180' height='80' rx='10' fill='#FFF4E0' stroke='#31415a' stroke-width='1.4'/>
<text x='130.0' y='147.0' text-anchor='middle'>Private node</text>
<text x='130.0' y='165.0' text-anchor='middle'>pulls an image</text>
<rect x='280' y='66' width='200' height='70' rx='10' fill='#E5F6E8' stroke='#31415a' stroke-width='1.4'/>
<text x='380.0' y='92.0' text-anchor='middle'>NAT gateway</text>
<text x='380.0' y='110.0' text-anchor='middle'>0.0.0.0/0 route</text>
<rect x='540' y='66' width='220' height='70' rx='10' fill='#F3E8FF' stroke='#31415a' stroke-width='1.4'/>
<text x='650.0' y='92.0' text-anchor='middle'>Public ECR and S3</text>
<text x='650.0' y='110.0' text-anchor='middle'>if no interface endpoint</text>
<rect x='280' y='186' width='200' height='80' rx='10' fill='#E7F7F7' stroke='#31415a' stroke-width='1.4'/>
<text x='380.0' y='217.0' text-anchor='middle'>S3 gateway endpoint</text>
<text x='380.0' y='235.0' text-anchor='middle'>prefix list, no hourly fee</text>
<rect x='540' y='186' width='220' height='80' rx='10' fill='#F3E8FF' stroke='#31415a' stroke-width='1.4'/>
<text x='650.0' y='217.0' text-anchor='middle'>Interface endpoints</text>
<text x='650.0' y='235.0' text-anchor='middle'>ecr.api and ecr.dkr</text>
<rect x='40' y='306' width='720' height='60' rx='10' fill='#F7F7F5' stroke='#31415a' stroke-width='1.4'/>
<text x='400.0' y='336.0' text-anchor='middle'>Image layers live in S3. ECR API and ECR DKR without an S3 path still fail. eks-auth is a different endpoint.</text>
</svg>
